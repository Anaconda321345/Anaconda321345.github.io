<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     แก้ไขข้อมูลเรซูเม่ของคุณได้ที่ไฟล์เดียวนี้
     เลื่อนลงไปหา <script id="resume-data"> ด้านล่างสุดของไฟล์
     ============================================================ */

  :root {
    --paper: #f6f5f1;
    --ink: #20241f;
    --ink-soft: #4d554a;
    --ink-faint: #838d80;
    --line: #d6d9cd;
    --accent: #2f5e46;
    --accent-soft: #e6ede7;
    font-size: 16px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 40px 80px;
  }

  /* ---------- Header ---------- */
  header.identity {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 2px solid var(--ink);
  }

  .identity-text { flex: 1; min-width: 0; }

  h1.name {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.7rem);
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .role-tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .contact-line {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .contact-line span { display: flex; align-items: center; gap: 8px; }
  .contact-line svg { flex: none; width: 15px; height: 15px; color: var(--accent); }
  .contact-line a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .contact-line a:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Photo placeholder ---------- */
  .photo-slot {
    flex: none;
    width: 140px;
    height: 140px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--accent-soft);
  }
  .photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-slot.empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px dashed var(--line);
    color: var(--ink-faint);
    font-size: 0.72rem;
    text-align: center;
    line-height: 1.4;
    padding: 8px;
  }
  .photo-slot.empty svg { width: 30px; height: 30px; color: var(--ink-faint); }

  /* ---------- Two-column section grid ---------- */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 44px;
  }

  .col { display: flex; flex-direction: column; }

  section.block { margin-bottom: 30px; }
  section.block:last-child { margin-bottom: 0; }

  .block-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .icon-circle {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-circle svg { width: 16px; height: 16px; color: #fff; }

  h2.block-title {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
    white-space: nowrap;
  }

  .block-rule {
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(to right, var(--line) 0 4px, transparent 4px 8px);
  }

  .block-body p {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  /* Education */
  .edu-item, .exp-item, .cert-item { margin-bottom: 14px; }
  .edu-item:last-child, .exp-item:last-child, .cert-item:last-child { margin-bottom: 0; }

  .edu-degree, .exp-title { font-weight: 600; font-size: 0.92rem; color: var(--ink); }
  .edu-school, .exp-org { color: var(--ink-soft); font-size: 0.87rem; margin-top: 2px; }
  .edu-year, .exp-period { color: var(--ink-faint); font-size: 0.78rem; margin-top: 2px; }
  .exp-desc { color: var(--ink-soft); font-size: 0.87rem; margin-top: 6px; line-height: 1.6; }

  /* Skills */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 0.8rem;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* Certificates */
  .cert-item { display: flex; gap: 8px; font-size: 0.87rem; color: var(--ink-soft); }
  .cert-item .dot { color: var(--accent); flex: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 680px) {
    .page { padding: 40px 22px 60px; }
    header.identity { flex-direction: column-reverse; align-items: flex-start; }
    .photo-slot { width: 96px; height: 96px; }
    .columns { grid-template-columns: 1fr; }
  }

  /* ---------- Print ---------- */
  @media print {
    body { background: #fff; }
    .page { max-width: 100%; padding: 0 8mm; }
    .columns { column-gap: 30px; }
    section.block { margin-bottom: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <main class="page">
    <header class="identity">
      <div class="identity-text">
        <h1 class="name" id="out-name"></h1>
        <span class="role-tag" id="out-role"></span>
        <div class="contact-line" id="out-contact"></div>
      </div>
      <div class="photo-slot" id="out-photo"></div>
    </header>

    <div class="columns">
      <div class="col" id="col-left"></div>
      <div class="col" id="col-right"></div>
    </div>
  </main>

            {

  <script>
    (function () {
      const d = resumeData;
      const ICONS = {
        pin: '<path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
        mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
        phone: '<path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1.2 1.2 0 0 1 1.2-.3 9.5 9.5 0 0 0 3 .5 1.2 1.2 0 0 1 1.2 1.2V20a1.2 1.2 0 0 1-1.2 1.2A17.2 17.2 0 0 1 3 4.2 1.2 1.2 0 0 1 4.2 3h3.4a1.2 1.2 0 0 1 1.2 1.2c0 1 .2 2 .5 3a1.2 1.2 0 0 1-.3 1.2l-2.4 2.4z"/>',
        link: '<path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 1 1 6 6l-1 1"/><path d="M13 18l-1 1a4 4 0 1 1-6-6l1-1"/>',
        user: '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/>',
        cap: '<path d="M12 4L2 9l10 5 10-5-10-5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>',
        tool: '<path d="M14.5 6.5a3.5 3.5 0 0 1-4.6 4.6l-6 6a1.6 1.6 0 0 0 2.3 2.3l6-6a3.5 3.5 0 0 1 4.6-4.6l-2.3 2.3-1.7-1.7 2.3-2.3z"/>',
        case: '<rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/>',
        star: '<path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.9 6.4 20.1l1.4-6.3-4.8-4.3 6.4-.6z"/>',
        badge: '<circle cx="12" cy="9" r="5.5"/><path d="M9 14.2L7 21l5-2.6L17 21l-2-6.8"/>'
      };
      function icon(name, size) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">${ICONS[name] || ""}</svg>`;
      }

      document.getElementById("out-name").textContent = d.name;
      document.getElementById("out-role").textContent = d.role;

      const contactEl = document.getElementById("out-contact");
      d.contact.forEach(c => {
        const span = document.createElement("span");
        const inner = c.href ? `<a href="${c.href}">${c.value}</a>` : c.value;
        span.innerHTML = `${icon(c.icon, 15)}${inner}`;
        contactEl.appendChild(span);
      });

      const photoEl = document.getElementById("out-photo");
      if (d.photoUrl) {
        photoEl.innerHTML = `<img src="${d.photoUrl}" alt="รูปโปรไฟล์ของ ${d.name}">`;
      } else {
        photoEl.classList.add("empty");
        photoEl.innerHTML = `${icon("user", 30)}<span>ใส่รูปโปรไฟล์<br>ที่นี่</span>`;
      }

      function renderBlock(block) {
        const section = document.createElement("section");
        section.className = "block";

        const head = document.createElement("div");
        head.className = "block-head";
        head.innerHTML = `
          <span class="icon-circle">${icon(block.icon, 16)}</span>
          <h2 class="block-title">${block.title}</h2>
          <span class="block-rule"></span>
        `;
        section.appendChild(head);

        const body = document.createElement("div");
        body.className = "block-body";

        if (block.type === "text") {
          body.innerHTML = `<p>${block.content}</p>`;
        } else if (block.type === "education") {
          body.innerHTML = block.items.map(e => `
            <div class="edu-item">
              <div class="edu-degree">${e.degree}</div>
              <div class="edu-school">${e.school}</div>
              <div class="edu-year">${e.year}</div>
            </div>
          `).join("");
        } else if (block.type === "skills") {
          body.innerHTML = block.groups.map(g => `
            <div style="margin-bottom:10px;">
              <div style="font-size:0.8rem;font-weight:600;color:var(--ink-faint);margin-bottom:6px;">${g.group}</div>
              <div class="tag-row">${g.items.map(i => `<span class="tag">${i}</span>`).join("")}</div>
            </div>
          `).join("");
        } else if (block.type === "experience") {
          body.innerHTML = block.items.map(e => `
            <div class="exp-item">
              <div class="exp-title">${e.title}</div>
              <div class="exp-org">${e.org}</div>
              <div class="exp-period">${e.period}</div>
              <div class="exp-desc">${e.desc}</div>
            </div>
          `).join("");
        } else if (block.type === "certs") {
          body.innerHTML = block.items.map(c => `
            <div class="cert-item"><span class="dot">•</span><span>${c}</span></div>
          `).join("");
        }

        section.appendChild(body);
        return section;
      }

      const colLeft = document.getElementById("col-left");
      const colRight = document.getElementById("col-right");
      d.left.forEach(b => colLeft.appendChild(renderBlock(b)));
      d.right.forEach(b => colRight.appendChild(renderBlock(b)));
    })();
  </script>
